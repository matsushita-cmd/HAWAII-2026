if(page==='schedule'){out=title('DAILY SCHEDULE','旅のスケジュール','日付を選んで予定を確認');out+=`<div class="days">${['MON','TUE','WED','THU','FRI','SAT','SUN'].map((w,i)=>`<button class="${selectedDay===i+7?'sel':''}" onclick="selectedDay=${i+7};show('schedule')"><small>${w}</small>${i+7}</button>`).join('')}</div><div class="timeline"><div class="smallcap">DECEMBER ${selectedDay}, 2026</div>${plans[selectedDay]?plans[selectedDay].map(e=>`<div class="event"><time>${e[0]}</time><div class="detail"><strong>${e[1]}</strong>${e[2]?e[2].startsWith('https://')?`<p><a href="${e[2]}" target="_blank" rel="noopener noreferrer">レストラン公式サイト・メニュー ↗</a></p>`:`<p>${e[2]}</p>`:''}${selectedDay===8&&e[0]==='19:00'?`<p><a class="action" href="${e[1].includes('ZIGU')?map('ZIGU 413 Seaside Ave Honolulu HI 96815'):map('Wasabi Bistro 250 Beach Walk Honolulu HI 96815')}" target="_blank" rel="noopener noreferrer">📍 Googleマップで場所を見る ↗</a></p>`:''}${selectedDay===9&&e[0]==='19:00'?`<p><a class="action" href="${map('Yoshitsune Restaurant 2586 Kalakaua Ave Honolulu HI 96815')}" target="_blank" rel="noopener noreferrer">📍 義経のGoogleマップ ↗</a></p>`:''}${selectedDay===11&&e[0]==='19:00'?`<p><a class="action" href="${map('DECK Queen Kapiolani Hotel 150 Kapahulu Ave Honolulu HI 96815')}" target="_blank" rel="noopener noreferrer">📍 DECK.のGoogleマップ ↗</a></p>`:''}${selectedDay===7&&e[0]==='17:30'?`<p><a class="action" href="https://www.google.com/maps/search/?api=1&query=Arancino%20di%20Mare%2C%202552%20Kalakaua%20Ave%2C%20Honolulu%2C%20HI%2096815" target="_blank" rel="noopener noreferrer">📍 アランチーノのGoogleマップ ↗</a></p>`:''}</div></div>`).join(''):'<div class="panel"><h3>スケジュール調整中 🌴</h3><p>決まり次第こちらに追加します。</p></div>'}</div>`}
if(page==='flight'){out=title('FLIGHT INFORMATION','フライト情報','JAL · 日本時間／ハワイ現地時間');out+=`<section class="section"><div class="panel"><div class="smallcap">OUTBOUND · 12/7 MON</div><p class="big flight-time">21:55 HND → 09:40 HNL</p><p>羽田空港 第3ターミナル → ホノルル</p><p><span class="flight-detail">20:00集合</span>｜3階 Fカウンター周辺</p></div><div class="panel"><div class="smallcap">RETURN · 12/12 SAT</div><p class="big flight-time">11:35 HNL → 16:05 HND</p><p>羽田到着は<span class="flight-detail">12/13（日）</span></p></div><a class="action" href="https://www.jal.co.jp/" target="_blank">JAL公式サイト ↗</a></section>`}

if(page==='transport'){out=title('BUS & TRANSIT','バス・交通案内','ワイキキ周辺で使える便利な交通手段');out+=`<section class="section"><div class="panel"><div class="smallcap">WAIKIKI TROLLEY</div><h3>🚎 ワイキキトロリー</h3><p><strong>JCBカード提示で対象のピンクラインが無料</strong></p><p>運行時間の目安：10:00〜20:30<br>運行間隔の目安：約15分</p><p class="hint">対象路線・乗車条件・最新の運行状況は公式サイトで確認してください。</p><a class="action" href="https://waikikitrolley.com/jp/map/" target="_blank" rel="noopener noreferrer">📍 ライブマップを見る ↗</a><a class="linkrow" href="https://waikikitrolley.com/jp/ala-moana-line/" target="_blank" rel="noopener noreferrer">ルート・時刻表を確認</a><p class="hint">ライブマップはスマホの「ホーム画面に追加」で保存しておくと便利です。</p></div><div class="panel"><div class="smallcap">JALOALO HIBUS</div><h3>🚌 HiBus（ハイバス）</h3><p><strong>JALOALOカード提示で対象路線が無料</strong></p><p>運行時間の目安：9:00〜20:50<br>運行間隔の目安：約25分</p><p><strong>カードの出し方</strong><br>① JALアプリを開く<br>② ホーム画面の「JALOALOカードを表示」をタップ<br>③ 乗車時にカードを提示</p><p class="hint">利用条件・ルート・運行時間は変更される場合があります。</p><a class="action" href="https://www.jal.co.jp/jp/ja/inter/route/hawaii/jaloalo/" target="_blank" rel="noopener noreferrer">JALOALO公式案内 ↗</a></div></section>`}

loa Ranch Oahu')}" target="_blank">Googleマップ ↗</a></div><div class="panel"><h3>DECK.</h3><p>12月11日 19:00〜 · 会長ご夫妻2名＋スプートニク7名＋宮古島2班9名（計18名）</p><a class="action" href="https://www.tripadvisor.jp/Restaurant_Review-g60982-d15246961-Reviews-Deck-Honolulu_Oahu_Hawaii.html" target="_blank">店舗情報 ↗</a><a class="linkrow" href="${map('Deck Honolulu Waikiki')}" target="_blank">Googleマップ ↗</a></div></section>`}
if(page==='photos'){out=title('HAWAII 2026 PHOTO ALBUM','写真アルバム','みんなのハワイの思い出をシェア ♡');out+=`<section class="section"><div class="panel"><div style="font-size:38px;text-align:center;margin:8px 0 12px">▧</div><h3 style="text-align:center">PHOTO ALBUM</h3><p style="text-align:center">旅行中に撮った写真を、みんなで共有しましょう！</p><p class="hint">Googleフォトの共有アルバムを使用します。下のボタンから写真を見たり、追加したりできます。</p><a class="linkrow" href="https://photos.app.goo.gl/edxPtBFTaySUWBN76" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;font-weight:700;padding:15px">写真を見る・追加する ↗</a></div><div class="panel"><h3>写真の共有方法</h3><p>① Googleフォトで共有アルバムを開く</p><p>② 「写真を追加」から撮影した写真を選ぶ</p><p>③ みんなの写真を閲覧・保存する</p><p class="hint">※ アルバム作成者が「共同編集」を有効にする必要があります。共有した写真は参加者が閲覧・保存できるため、公開範囲にご注意ください。</p></div></section>`}
if(page==='guide'){out=title('HAWAII TRAVEL GUIDE','旅行ガイド','旅行前・滞在中に役立つ情報');out+=`<section class="section"><h3>ハワイ旅行のお役立ち情報</h3><p class="hint">気になる項目をタップすると、外部サイトの記事が開きます。</p><div class="panel"><h3>ハワイ旅行で役立つ英語フレーズ</h3><p class="hint">Aloha Street｜旅行中に使える英語表現</p><a class="linkrow" href="https://www.aloha-street.com/article/2023/01/380655/" target="_blank" rel="noopener noreferrer">記事を読む ↗</a></div><div class="panel"><h3>ハワイのチップの相場・計算方法・渡し方</h3><p class="hint">Aloha Street｜レストランやホテルでのチップの基本</p><a class="linkrow" href="https://www.aloha-street.com/article/2019/03/314798/" target="_blank" rel="noopener noreferrer">チップのガイドを見る ↗</a></div><div class="panel"><h3>ハワイ旅行の持ち物リスト</h3><p class="hint">阪急交通社｜出発前に確認したい持ち物や便利なアイテム</p><a class="linkrow" href="https://www.hankyu-travel.com/guide/hawaii/baggage.php" target="_blank" rel="noopener noreferrer">持ち物ガイドを見る ↗</a></div><div class="panel"><h3>ハワイのマナー・ルール</h3><p class="hint">allhawaii｜滞在中に知っておきたい現地のマナー</p><a class="linkrow" href="https://www.allhawaii.jp/travelinfo/manners/" target="_blank" rel="noopener noreferrer">マナー・ルールを見る ↗</a></div></section>`}
v.innerHTML=out+'<div class="footer">HAWAII EMPLOYEE TRIP · 2026</div>';document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));window.scrollTo(0,0)}
